name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          name="arq_${GOOS}_${GOARCH}"
          mkdir -p dist
          if [ "$GOOS" = windows ]; then
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${name}/arq.exe" ./cmd/arq
          else
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${name}/arq" ./cmd/arq
          fi
          tar -czf "dist/${name}.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: arq_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          path: dist/arq_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
